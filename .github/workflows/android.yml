name: Android APK

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Test local storage and camera
        run: npm test
      - name: Build bundled app and sync Android
        run: npm run android:sync
      - name: Build installable APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: bash gradlew assembleDebug --no-daemon
      - name: Prepare download
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/Il-Mio-Armadio.apk
          sha256sum apk/Il-Mio-Armadio.apk > apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Il-Mio-Armadio-Android
          path: apk/
          if-no-files-found: error
          retention-days: 30
